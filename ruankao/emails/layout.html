<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f4;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f4;padding:24px 12px;">
<tr><td align="center">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e7e5e4;border-radius:12px;overflow:hidden;">
    <tr>
      <td style="padding:20px 24px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
        <div style="font-size:15px;font-weight:600;color:#1c1917;">{{ site_name }}</div>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 24px 4px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.75;color:#1c1917;">
        {% block content %}{% endblock %}
      </td>
    </tr>
    <tr>
      <td style="padding:20px 24px 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
        <div style="border-top:1px solid #e7e5e4;padding-top:14px;font-size:12px;line-height:1.7;color:#78716c;">
          {{ footer_note }}
          {% if unsubscribe_url %}
          <br>不想再收到提醒？<a href="{{ unsubscribe_url }}" style="color:#57534e;">一键退订</a>{% if manage_url %}，或在<a href="{{ manage_url }}" style="color:#57534e;">管理页</a>里调整{% endif %}。
          {% endif %}
          {% if operator %}
          <br>本服务由 {{ operator }} 提供。
          {% endif %}
          {% if contact_email %}
          <br>联系方式：{{ contact_email }}
          {% endif %}
        </div>
      </td>
    </tr>
  </table>
  <div style="max-width:560px;margin:12px auto 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:11px;line-height:1.6;color:#a8a29e;text-align:center;">
    {{ disclaimer }}
  </div>
</td></tr>
</table>
</body>
</html>
