<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="软考报名提醒">
  <title>软考报名提醒</title>
  <!--
    品牌标记：日历上标出「窗口期」。

    为什么是日历而不是抽象图形：这个产品解决的就是「报名窗口期很短、
    各省时间还不一样、没人替你盯着」。日历上那一条琥珀色，就是被盯住的那段窗口。

    设计约束（改动前请先看）：
    - 目标尺寸是 16px（浏览器标签页）到 32px，所有元素必须在这个范围存活。
      两个挂环在 16px 下会糊掉，这是**故意的**——大尺寸补足「日历」语义，
      小尺寸自然退化成轮廓，剩下的圆角矩形 + 分隔线 + 琥珀色块依然成立。
    - 主色 #0f172a 与站点 CSS 变量 accent 一致；琥珀 #f59e0b 是「提醒」的语义色。
    - 深色标签栏（Chrome 深色主题 #202124）下压测过：靠白色内容保持辨识度，
      不依赖色块边缘。
  -->
  <rect width="32" height="32" rx="9" fill="#0f172a"/>
  <!-- 挂环：大尺寸下让轮廓读起来是日历 -->
  <path d="M12.3 6.2v4M19.7 6.2v4" fill="none" stroke="#ffffff"
        stroke-width="2.4" stroke-linecap="round"/>
  <!-- 日历主体 -->
  <rect x="7.1" y="9.4" width="17.8" height="15.6" rx="3.4"
        fill="none" stroke="#ffffff" stroke-width="2.6"/>
  <!-- 标题栏分隔线 -->
  <line x1="7.1" y1="14.3" x2="24.9" y2="14.3" stroke="#ffffff" stroke-width="2.6"/>
  <!-- 被标出的窗口期 -->
  <rect x="11.1" y="17.2" width="9.8" height="4.3" rx="2.1" fill="#f59e0b"/>
</svg>
