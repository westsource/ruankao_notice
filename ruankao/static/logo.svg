<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="软考报名提醒">
  <title>软考报名提醒</title>
  <!--
    品牌标记：日历上标出「窗口期」。

    配色演进（改之前先看这段）：
    第一版用 #0f172a 填满整个图标 —— 在浅色页面上就是一块黑砖，看起来沉闷。
    第二版换成琥珀底板，理由是琥珀同时兼作站点的品牌色和「临近/需要注意」的语义色。
    第三版站点整体转商务风，品牌色改为深靛蓝（#1e3a8a），琥珀退回**纯语义色**。
    第四版（当前）品牌色改为深松绿（#115e59）：靛蓝与政务类站点撞色太近，
    松绿在同为深色商务底的前提下把品牌拉开了。松绿底板 + 白色日历 + 琥珀窗口期，
    琥珀与松绿是互补色，比在靛蓝底上更跳，「这几天要注意」的语义更直给。

    为什么仍然要底板（试过去掉，不行）：
    无底板的纯线条版本在页头上最好看，但浏览器标签页有浅色和深色两种主题，
    深色主题（#202124）下深色线条几乎看不见。底板是跨主题的唯一解，
    所以要换掉的是它的颜色，不是它的存在。
    顺带说一句，深色底板在深色标签栏下必须比纯黑（#0f172a）亮一档，
    否则糊进背景里——深松绿 #115e59 的相对亮度约 0.09，和靛蓝 #1e3a8a 同档，够用。

    尺寸约束：目标是 16–32px。两个挂环在 16px 下会糊掉，这是**故意的** ——
    大尺寸补足「日历」语义，小尺寸退化成轮廓，白色日历 + 琥珀块仍然成立。
  -->
  <rect width="32" height="32" rx="9" fill="#115e59"/>
  <!-- 挂环：大尺寸下让轮廓读起来是日历 -->
  <path d="M12.3 6.2v4M19.7 6.2v4" fill="none" stroke="#ffffff"
        stroke-width="2.4" stroke-linecap="round"/>
  <!-- 日历主体 -->
  <rect x="7.1" y="9.4" width="17.8" height="15.6" rx="3.4"
        fill="none" stroke="#ffffff" stroke-width="2.6"/>
  <!-- 标题栏分隔线 -->
  <line x1="7.1" y1="14.3" x2="24.9" y2="14.3" stroke="#ffffff" stroke-width="2.6"/>
  <!-- 被标出的窗口期：用琥珀强调，而不是加深蓝色——
       它是站点里唯一的暖色，视线会自动落在这里，正好符合「这几天要注意」的语义 -->
  <rect x="11.1" y="17.2" width="9.8" height="4.3" rx="2.1" fill="#f59e0b"/>
</svg>
